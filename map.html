<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interactive Globe with Landmarks</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            overflow-x: hidden;
        }

        .header {
            background: rgba(102, 126, 234, 0.2);
            backdrop-filter: blur(10px);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid rgba(102, 126, 234, 0.5);
            position: relative;
            z-index: 10;
        }

        .header h1 {
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        #globe-container {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        .controls-info {
            position: absolute;
            top: 120px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid rgba(102, 126, 234, 0.5);
            max-width: 300px;
            z-index: 100;
        }

        .controls-info h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .controls-info p {
            margin: 8px 0;
            font-size: 0.9em;
            line-height: 1.5;
        }

        .controls-info ul {
            margin: 10px 0;
            padding-left: 20px;
        }

        .controls-info li {
            margin: 5px 0;
            font-size: 0.9em;
        }

        .location-info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 15px;
            border: 2px solid rgba(102, 126, 234, 0.6);
            max-width: 500px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 100;
        }

        .location-info.visible {
            opacity: 1;
        }

        .location-info h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.5em;
        }

        .location-info p {
            margin: 5px 0;
            font-size: 1em;
        }

        .legend {
            position: absolute;
            top: 120px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid rgba(102, 126, 234, 0.5);
            max-width: 280px;
            z-index: 100;
        }

        .legend h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin: 10px 0;
            cursor: pointer;
            padding: 8px;
            border-radius: 5px;
            transition: background 0.2s;
        }

        .legend-item:hover {
            background: rgba(102, 126, 234, 0.2);
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 3px;
            margin-right: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .legend-text {
            font-size: 0.9em;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5em;
            color: #667eea;
            z-index: 200;
        }

        @media (max-width: 768px) {
            .controls-info, .legend {
                max-width: 250px;
                padding: 15px;
                font-size: 0.85em;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .location-info {
                max-width: 90%;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌍 Interactive 3D Globe</h1>
        <p>Rotate the globe and explore world landmarks in 3D</p>
    </div>

    <div id="globe-container">
        <div class="loading">Loading Globe...</div>
    </div>

    <div class="controls-info">
        <h3>🎮 Controls</h3>
        <ul>
            <li><strong>Drag:</strong> Rotate globe</li>
            <li><strong>Scroll:</strong> Zoom in/out</li>
            <li><strong>Click 3D figure:</strong> View info</li>
            <li><strong>Right-click drag:</strong> Pan view</li>
        </ul>
    </div>

    <div class="legend">
        <h3>📍 Landmarks</h3>
        <div id="legend-list"></div>
    </div>

    <div class="location-info" id="location-info">
        <h3 id="location-name">Location</h3>
        <p id="location-description"></p>
        <p id="location-details"></p>
    </div>

    <!-- Three.js -->
    <script src="https://unpkg.com/three@0.159.0/build/three.min.js"></script>
    <!-- Globe.gl -->
    <script src="https://unpkg.com/globe.gl@2.31.0/dist/globe.gl.min.js"></script>

    <script>
        // Locations data with 3D model configurations
        const locations = [
            {
                name: "Eiffel Tower",
                lat: 48.8584,
                lng: 2.2945,
                description: "Iconic iron lattice tower in Paris, France",
                category: "Monument",
                established: "1889",
                color: "#ff6b6b",
                modelType: "tower"
            },
            {
                name: "Statue of Liberty",
                lat: 40.6892,
                lng: -74.0445,
                description: "Colossal neoclassical sculpture on Liberty Island, New York",
                category: "Monument",
                established: "1886",
                color: "#4ecdc4",
                modelType: "statue"
            },
            {
                name: "Sydney Opera House",
                lat: -33.8568,
                lng: 151.2153,
                description: "Multi-venue performing arts centre in Sydney, Australia",
                category: "Cultural",
                established: "1973",
                color: "#45b7d1",
                modelType: "opera"
            },
            {
                name: "Taj Mahal",
                lat: 27.1751,
                lng: 78.0421,
                description: "Ivory-white marble mausoleum in Agra, India",
                category: "Monument",
                established: "1653",
                color: "#f9ca24",
                modelType: "dome"
            },
            {
                name: "Big Ben",
                lat: 51.5007,
                lng: -0.1246,
                description: "Great bell of the clock at Palace of Westminster, London",
                category: "Monument",
                established: "1859",
                color: "#f0932b",
                modelType: "tower"
            },
            {
                name: "Christ the Redeemer",
                lat: -22.9519,
                lng: -43.2105,
                description: "Art Deco statue of Jesus Christ in Rio de Janeiro, Brazil",
                category: "Monument",
                established: "1931",
                color: "#6c5ce7",
                modelType: "statue"
            },
            {
                name: "Colosseum",
                lat: 41.8902,
                lng: 12.4922,
                description: "Ancient amphitheatre in Rome, Italy",
                category: "Historical",
                established: "80 AD",
                color: "#a29bfe",
                modelType: "colosseum"
            },
            {
                name: "Great Wall of China",
                lat: 40.4319,
                lng: 116.5704,
                description: "Series of fortifications in northern China",
                category: "Historical",
                established: "7th century BC",
                color: "#fd79a8",
                modelType: "wall"
            }
        ];

        // Create 3D models for different monument types
        function create3DModel(type, color) {
            const group = new THREE.Group();
            const material = new THREE.MeshPhongMaterial({
                color: color,
                emissive: color,
                emissiveIntensity: 0.3,
                shininess: 30
            });

            switch(type) {
                case 'tower':
                    // Eiffel Tower / Big Ben style
                    const base = new THREE.Mesh(
                        new THREE.BoxGeometry(0.4, 0.2, 0.4),
                        material
                    );
                    base.position.y = 0.1;

                    const tower = new THREE.Mesh(
                        new THREE.ConeGeometry(0.2, 1.5, 4),
                        material
                    );
                    tower.position.y = 1;

                    group.add(base);
                    group.add(tower);
                    break;

                case 'statue':
                    // Statue of Liberty / Christ the Redeemer
                    const pedestal = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.25, 0.3, 0.4, 8),
                        material
                    );
                    pedestal.position.y = 0.2;

                    const body = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.15, 0.2, 0.8, 8),
                        material
                    );
                    body.position.y = 0.8;

                    const head = new THREE.Mesh(
                        new THREE.SphereGeometry(0.15, 8, 8),
                        material
                    );
                    head.position.y = 1.35;

                    group.add(pedestal);
                    group.add(body);
                    group.add(head);
                    break;

                case 'opera':
                    // Sydney Opera House shells
                    for(let i = 0; i < 3; i++) {
                        const shell = new THREE.Mesh(
                            new THREE.SphereGeometry(0.3, 8, 8, 0, Math.PI, 0, Math.PI/2),
                            material
                        );
                        shell.position.x = (i - 1) * 0.3;
                        shell.position.y = 0.3;
                        shell.rotation.z = Math.PI / 4;
                        group.add(shell);
                    }
                    break;

                case 'dome':
                    // Taj Mahal
                    const platform = new THREE.Mesh(
                        new THREE.BoxGeometry(0.6, 0.15, 0.6),
                        material
                    );
                    platform.position.y = 0.075;

                    const building = new THREE.Mesh(
                        new THREE.BoxGeometry(0.5, 0.5, 0.5),
                        material
                    );
                    building.position.y = 0.5;

                    const dome = new THREE.Mesh(
                        new THREE.SphereGeometry(0.25, 8, 8, 0, Math.PI * 2, 0, Math.PI / 2),
                        material
                    );
                    dome.position.y = 0.95;

                    const spire = new THREE.Mesh(
                        new THREE.ConeGeometry(0.05, 0.3, 8),
                        material
                    );
                    spire.position.y = 1.3;

                    group.add(platform);
                    group.add(building);
                    group.add(dome);
                    group.add(spire);
                    break;

                case 'colosseum':
                    // Roman Colosseum
                    const ring1 = new THREE.Mesh(
                        new THREE.TorusGeometry(0.35, 0.15, 8, 16, Math.PI * 2),
                        material
                    );
                    ring1.rotation.x = Math.PI / 2;
                    ring1.position.y = 0.3;

                    const ring2 = new THREE.Mesh(
                        new THREE.TorusGeometry(0.35, 0.1, 8, 16, Math.PI * 2),
                        material
                    );
                    ring2.rotation.x = Math.PI / 2;
                    ring2.position.y = 0.5;

                    group.add(ring1);
                    group.add(ring2);
                    break;

                case 'wall':
                    // Great Wall of China - serpentine wall
                    for(let i = 0; i < 5; i++) {
                        const segment = new THREE.Mesh(
                            new THREE.BoxGeometry(0.15, 0.4, 0.15),
                            material
                        );
                        segment.position.x = (i - 2) * 0.2;
                        segment.position.z = Math.sin(i * 0.5) * 0.2;
                        segment.position.y = 0.2 + Math.sin(i * 0.5) * 0.1;
                        group.add(segment);

                        // Watchtowers
                        if(i % 2 === 0) {
                            const tower = new THREE.Mesh(
                                new THREE.CylinderGeometry(0.1, 0.1, 0.6, 8),
                                material
                            );
                            tower.position.x = (i - 2) * 0.2;
                            tower.position.z = Math.sin(i * 0.5) * 0.2;
                            tower.position.y = 0.5;
                            group.add(tower);
                        }
                    }
                    break;
            }

            // Add a glowing ring around the base
            const ring = new THREE.Mesh(
                new THREE.RingGeometry(0.4, 0.5, 32),
                new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 0.3,
                    side: THREE.DoubleSide
                })
            );
            ring.rotation.x = -Math.PI / 2;
            group.add(ring);

            return group;
        }

        // Initialize Globe
        const globe = Globe()
            (document.getElementById('globe-container'))
            .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
            .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
            .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
            .objectsData(locations)
            .objectLat('lat')
            .objectLng('lng')
            .objectAltitude(0.01)
            .objectThreeObject(d => create3DModel(d.modelType, d.color))
            .onObjectClick(d => {
                // Show location info
                const infoPanel = document.getElementById('location-info');
                document.getElementById('location-name').textContent = d.name;
                document.getElementById('location-description').textContent = d.description;
                document.getElementById('location-details').textContent =
                    `${d.category} • Established: ${d.established}`;
                infoPanel.classList.add('visible');

                // Hide after 5 seconds
                setTimeout(() => {
                    infoPanel.classList.remove('visible');
                }, 5000);

                // Animate to location
                globe.pointOfView({ lat: d.lat, lng: d.lng, altitude: 2.5 }, 1000);
            })
            .onObjectHover(d => {
                document.body.style.cursor = d ? 'pointer' : 'default';
            });

        // Add atmosphere
        globe.atmosphereColor('rgba(102, 126, 234, 0.4)');
        globe.atmosphereAltitude(0.25);

        // Auto-rotate
        let autoRotate = true;
        globe.controls().autoRotate = true;
        globe.controls().autoRotateSpeed = 0.5;

        // Stop auto-rotate on user interaction
        globe.controls().addEventListener('start', () => {
            autoRotate = false;
            globe.controls().autoRotate = false;
        });

        // Create legend
        const legendList = document.getElementById('legend-list');
        locations.forEach(location => {
            const item = document.createElement('div');
            item.className = 'legend-item';
            item.innerHTML = `
                <div class="legend-color" style="background: ${location.color}"></div>
                <div class="legend-text">${location.name}</div>
            `;
            item.addEventListener('click', () => {
                globe.pointOfView({ lat: location.lat, lng: location.lng, altitude: 2 }, 1000);
            });
            legendList.appendChild(item);
        });

        // Remove loading message
        setTimeout(() => {
            const loading = document.querySelector('.loading');
            if(loading) loading.remove();
        }, 2000);

        // Set initial view
        globe.pointOfView({ lat: 20, lng: 0, altitude: 2.5 });

        // Add ambient lighting
        const scene = globe.scene();
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        scene.add(new THREE.DirectionalLight(0xffffff, 0.8));

        // Resize handler
        window.addEventListener('resize', () => {
            globe.width(window.innerWidth);
            globe.height(window.innerHeight);
        });
    </script>
</body>
</html>
